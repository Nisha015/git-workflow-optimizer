name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automated tests
        run: python -m pytest -v

  smoke-test:
    name: Deploy smoke test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Start application and check health endpoint
        run: |
          python -c "import app; app.app.run(port=5000)" &
          for i in $(seq 1 15); do
            curl -sf http://127.0.0.1:5000/api/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:5000/api/health
          curl -sf http://127.0.0.1:5000/api/recommendation | python -m json.tool > /dev/null
          echo "Smoke test passed - ready to deploy"
